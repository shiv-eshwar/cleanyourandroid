name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[mcp]"
      - run: python -m unittest discover -s tests -v
      - run: cleanyourandroid --help
      - run: python -c "from cleanyourandroid.mcp_server import make_server; make_server()"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Allow the runner to use KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Install fixture build tools
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Exercise the CLI on a fresh Android 16 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          avd-name: cleanandroid-ci
          disable-animations: false
          script: |
            bash tests/integration/emulator.sh
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then python -m pip install . && python docs/demo/capture.py; fi
      - name: Save emulator screenshots and selected CLI output for the README
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readme-demo
          path: ${{ runner.temp }}/readme-demo/
          retention-days: 3
          if-no-files-found: error
